<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseFlow — Enterprise Project Management Dashboard</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <!-- Chart.js CDN for Analytics & Metrics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="h-full flex flex-col overflow-hidden text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Top Navigation Header -->
  <header class="glass-nav border-b border-slate-200/80 sticky top-0 z-40 px-4 lg:px-6 py-2.5 flex-shrink-0 shadow-sm">
    <div class="flex items-center justify-between gap-4">

      <!-- Left: Logo & Board Switcher -->
      <div class="flex items-center gap-4">
        <!-- Logo -->
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-md shadow-indigo-500/20 text-white font-black text-lg tracking-wider">
            ⚡
          </div>
          <div class="hidden md:block">
            <div class="flex items-center gap-1.5">
              <span class="font-extrabold text-slate-900 tracking-tight text-base">PulseFlow</span>
              <span class="text-[9px] font-bold uppercase tracking-wider bg-indigo-100 text-indigo-700 px-1.5 py-0.2 rounded-md">Pro</span>
            </div>
            <p class="text-[10px] text-slate-400 font-medium">Project Workspace</p>
          </div>
        </div>

        <div class="h-6 w-px bg-slate-200 hidden md:block"></div>

        <!-- Board Selector Dropdown -->
        <div class="relative" id="board-selector-dropdown">
          <!-- Dynamically populated by app.js -->
        </div>

        <!-- Board Settings Button -->
        <button id="board-settings-top-btn" class="p-1.5 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-xl transition" title="Board Settings">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
        </button>
      </div>

      <!-- Center: View Switcher Tabs -->
      <div class="hidden lg:flex items-center p-1 bg-slate-100/90 rounded-2xl border border-slate-200/80">
        <button class="view-tab-btn flex items-center gap-1.5 px-3 py-1.5 text-xs font-bold rounded-xl transition bg-white text-indigo-600 shadow-sm" data-view="kanban">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"></path>
          </svg>
          Kanban Board
        </button>

        <button class="view-tab-btn flex items-center gap-1.5 px-3 py-1.5 text-xs font-bold rounded-xl transition text-slate-600 hover:text-slate-900" data-view="table">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
          </svg>
          Table List
        </button>

        <button class="view-tab-btn flex items-center gap-1.5 px-3 py-1.5 text-xs font-bold rounded-xl transition text-slate-600 hover:text-slate-900" data-view="timeline">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
          Timeline
        </button>

        <button class="view-tab-btn flex items-center gap-1.5 px-3 py-1.5 text-xs font-bold rounded-xl transition text-slate-600 hover:text-slate-900" data-view="metrics">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
          </svg>
          Analytics
        </button>
      </div>

      <!-- Right: Search, Filters, Persistence Status & User Persona Selector -->
      <div class="flex items-center gap-3">
        <!-- Search Input -->
        <div class="relative hidden sm:block w-48 xl:w-64">
          <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          <input type="text" id="global-search-input"
                 placeholder="Search cards... (/)"
                 class="w-full text-xs bg-slate-100 hover:bg-slate-200/60 focus:bg-white border border-transparent focus:border-indigo-300 rounded-xl pl-9 pr-7 py-1.5 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" />
          <kbd class="absolute right-2.5 top-1/2 -translate-y-1/2 text-[10px] font-mono font-semibold text-slate-400 bg-white px-1.5 py-0.5 rounded border border-slate-200 shadow-xs">
            /
          </kbd>
        </div>

        <!-- Priority Filter Dropdown -->
        <select id="filter-priority-select" class="hidden xl:block text-xs font-semibold bg-white border border-slate-200 rounded-xl py-1.5 px-2.5 text-slate-700 hover:border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-xs">
          <option value="all">All Priorities</option>
          <option value="urgent">🚨 Urgent</option>
          <option value="high">🔥 High</option>
          <option value="medium">⚡ Medium</option>
          <option value="low">☕ Low</option>
        </select>

        <!-- Assignee Filter Dropdown -->
        <select id="filter-assignee-select" class="hidden 2xl:block text-xs font-semibold bg-white border border-slate-200 rounded-xl py-1.5 px-2.5 text-slate-700 hover:border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-xs">
          <option value="all">All Members</option>
        </select>

        <!-- Persistence & Backup Indicator Button -->
        <button id="open-backup-btn" class="flex items-center gap-1.5 px-2.5 py-1.5 text-xs font-semibold rounded-xl bg-slate-100 hover:bg-slate-200/80 transition" title="Data Persistence & Backup Settings">
          <span id="persistence-indicator" class="flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 pulse-sync"></span>
            <span class="text-emerald-700 hidden sm:inline">Disk Persistent</span>
          </span>
        </button>

        <!-- + New Task Button -->
        <button id="header-new-task-btn" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-sm transition active:scale-95">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
          </svg>
          <span class="hidden sm:inline">New Card</span>
        </button>

        <!-- User Persona / RBAC Switcher Widget -->
        <div id="user-profile-widget">
          <!-- Dynamically populated by app.js -->
        </div>
      </div>
    </div>
  </header>

  <!-- Mobile View Switcher Tab Row -->
  <div class="lg:hidden flex items-center justify-around border-b border-slate-200 bg-white px-2 py-1.5 text-xs font-bold text-slate-600">
    <button class="view-tab-btn py-1 px-2.5 rounded-lg text-indigo-600 bg-indigo-50" data-view="kanban">Kanban</button>
    <button class="view-tab-btn py-1 px-2.5 rounded-lg" data-view="table">Table</button>
    <button class="view-tab-btn py-1 px-2.5 rounded-lg" data-view="timeline">Timeline</button>
    <button class="view-tab-btn py-1 px-2.5 rounded-lg" data-view="metrics">Metrics</button>
  </div>

  <!-- Main View Container -->
  <main class="flex-1 overflow-hidden p-4 lg:p-6" id="main-view-container">
    <!-- Active view (Kanban, Table, Timeline, or Metrics) renders here -->
  </main>

  <!-- Modals -->
  <div id="card-modal-backdrop" class="modal-backdrop fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4"></div>
  <div id="board-modal-backdrop" class="modal-backdrop fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4"></div>
  <div id="user-modal-backdrop" class="modal-backdrop fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4"></div>
  <div id="backup-modal-backdrop" class="modal-backdrop fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Main App Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
